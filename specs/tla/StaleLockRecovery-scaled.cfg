\* TLC safety config for StaleLockRecovery — scaled to 5 procs, 3 locks.
\* Uses symmetry to collapse 5! x 3! = 720x equivalent states.
\* Run: java -XX:+UseParallelGC -Xmx12g -cp tools\tla2tools.jar tlc2.TLC StaleLockRecovery.tla -config StaleLockRecovery-scaled.cfg -workers auto

CONSTANTS
    Procs = {p1, p2, p3, p4, p5}
    Locks = {merge, worktree_setup, beads_db}

SYMMETRY FullSymmetry

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoDoubleBreak
INVARIANT LiveLockNeverBroken
