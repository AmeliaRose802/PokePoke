\* TLC model configuration for StaleLockRecovery
\* Run: tlc StaleLockRecovery.tla -config StaleLockRecovery.cfg

CONSTANTS
    Procs = {p1, p2, p3}
    Locks = {merge, worktree_setup}

SPECIFICATION Spec

\* Deadlock detection ON — Terminated stuttering step covers legitimate
\* terminal states; any other deadlock is a real bug.

\* Safety invariants
INVARIANT TypeOK
INVARIANT NoDoubleBreak
INVARIANT LiveLockNeverBroken

\* Liveness (uncomment and change SPECIFICATION to FairSpec)
\* PROPERTY NoPhantomLocks
\* PROPERTY CrashRecovery
