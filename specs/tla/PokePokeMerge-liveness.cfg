\* TLC liveness model configuration for PokePokeMerge
\* Run: tlc PokePokeMerge.tla -config PokePokeMerge-liveness.cfg

CONSTANTS
    Agents = {a1, a2}
    MaxConflictRetries = 2

SPECIFICATION FairSpec

\* Safety invariants (still checked)
INVARIANT TypeOK
INVARIANT MergeMutex
INVARIANT LockHolderConsistency
INVARIANT CleanupNeverHoldsLock
INVARIANT RetryBound

\* Liveness properties
PROPERTY MergeLiveness
PROPERTY LockFreedom
