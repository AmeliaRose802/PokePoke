\* TLC safety config for WorkItemClaim — scaled to 4 agents, 3 items.
\* Uses symmetry to collapse 4! x 3! = 144x equivalent states.
\* Items model "in-flight" work (bounded by agent count), not queue size.
\* Run: java -XX:+UseParallelGC -Xmx12g -cp tools\tla2tools.jar tlc2.TLC WorkItemClaim.tla -config WorkItemClaim-scaled.cfg -workers auto

CONSTANTS
    Agents = {a1, a2, a3, a4}
    Items = {i1, i2, i3}

SYMMETRY FullSymmetry

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT NoDuplicateClaim
INVARIANT LockExclusion
INVARIANT ClaimImpliesOwnership
INVARIANT ActiveSessionOwned
INVARIANT JournalPrecedence
