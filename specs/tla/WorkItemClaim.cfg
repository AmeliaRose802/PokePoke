\* TLC model configuration for WorkItemClaim
\* Run: tlc WorkItemClaim.tla -config WorkItemClaim.cfg

CONSTANTS
    Agents = {a1, a2}
    Items = {i1, i2}

SPECIFICATION Spec

\* Deadlock detection ON — Terminated stuttering step covers legitimate
\* terminal states; any other deadlock is a real bug.

\* Safety invariants
INVARIANT TypeOK
INVARIANT NoDuplicateClaim
INVARIANT LockExclusion
INVARIANT ClaimImpliesOwnership
INVARIANT ActiveSessionOwned
INVARIANT JournalPrecedence

\* Liveness (uncomment and change SPECIFICATION to FairSpec)
\* PROPERTY ClaimLiveness
