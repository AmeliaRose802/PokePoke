\* TLC safety config for PokePokeMerge — scaled to 5 agents, 3 retries.
\* Uses symmetry to collapse 5! = 120x equivalent states.
\* Run: java -XX:+UseParallelGC -Xmx12g -cp tools\tla2tools.jar tlc2.TLC PokePokeMerge.tla -config PokePokeMerge-scaled.cfg -workers auto

CONSTANTS
    Agents = {a1, a2, a3, a4, a5}
    MaxConflictRetries = 3

SYMMETRY AgentSymmetry

SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT MergeMutex
INVARIANT LockHolderConsistency
INVARIANT CleanupNeverHoldsLock
INVARIANT RetryBound
