\* TLC model configuration for PokePokeMerge
\* Run: tlc PokePokeMerge.tla -config PokePokeMerge.cfg

CONSTANTS
    Agents = {a1, a2, a3}
    MaxConflictRetries = 3

SPECIFICATION Spec

\* Safety invariants (checked on every state)
INVARIANT TypeOK
INVARIANT MergeMutex
INVARIANT LockHolderConsistency
INVARIANT CleanupNeverHoldsLock
INVARIANT RetryBound

\* Liveness properties (require fairness — use FairSpec)
\* Uncomment and change SPECIFICATION to FairSpec to check:
\* PROPERTY MergeLiveness
\* PROPERTY LockFreedom
