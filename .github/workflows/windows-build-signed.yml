name: Build Windows Release with Code Signing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        type: string
      skip_signing:
        description: 'Skip code signing (for testing)'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '18'

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Determine version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "push") {
          $version = "${{ github.ref_name }}" -replace '^v', ''
        } else {
          $version = "${{ github.event.inputs.version }}"
        }
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Building version: $version"

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: './desktop/package-lock.json'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install pyinstaller

    - name: Install desktop dependencies
      run: npm ci
      working-directory: ./desktop

    - name: Build React frontend
      run: npm run build
      working-directory: ./desktop

    - name: Install AzureSignTool (if not skipping signing)
      if: ${{ !github.event.inputs.skip_signing }}
      run: |
        Write-Host "Installing AzureSignTool..."
        dotnet tool install --global AzureSignTool
        Write-Host "AzureSignTool version:"
        AzureSignTool --version

    - name: Download WebView2 Bootstrapper
      run: |
        Write-Host "Downloading WebView2 bootstrapper..."
        $webview2Path = "packaging/installer/MicrosoftEdgeWebview2Setup.exe"
        
        # Create directory if it doesn't exist
        $dir = Split-Path $webview2Path -Parent
        if (!(Test-Path $dir)) {
          New-Item -ItemType Directory -Path $dir -Force
        }
        
        # Download WebView2 bootstrapper
        Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview2Path
        
        # Verify download
        if (Test-Path $webview2Path) {
          $fileInfo = Get-Item $webview2Path
          Write-Host "✓ Downloaded WebView2 bootstrapper: $($fileInfo.Length) bytes"
        } else {
          Write-Error "Failed to download WebView2 bootstrapper"
          exit 1
        }

    - name: Run tests
      run: |
        Write-Host "Running Python tests..."
        pytest tests/ --timeout=300 -v
      timeout-minutes: 10

    - name: Build PyInstaller executable
      env:
        # Azure Trusted Signing credentials (only set if secrets exist)
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        AZURE_TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.AZURE_SIGNING_PROFILE }}
      run: |
        Write-Host "Building PyInstaller executable with code signing..."
        
        $buildParams = @()
        
        # Add certificate source if Azure credentials are available and not skipping signing
        if ("${{ secrets.AZURE_CLIENT_ID }}" -and "${{ secrets.AZURE_CLIENT_SECRET }}" -and ("${{ github.event.inputs.skip_signing }}" -ne "true")) {
          Write-Host "Using Azure Trusted Signing"
          $buildParams += "-CertificateSource", "Azure"
        } elseif ("${{ github.event.inputs.skip_signing }}" -eq "true") {
          Write-Host "Skipping code signing (requested)"
          $buildParams += "-SkipSigning"
        } else {
          Write-Host "No Azure credentials available, will try auto-detection"
        }
        
        # Add verbose output for CI
        $buildParams += "-Verbose"
        
        # Run the build
        & ".\packaging\pyinstaller\build_with_signing.ps1" @buildParams
        
        # Verify executable was created
        $exePath = "dist\PokePoke\PokePoke.exe"
        if (Test-Path $exePath) {
          $fileInfo = Get-Item $exePath
          Write-Host "✓ Executable created: $($fileInfo.Length) bytes"
        } else {
          Write-Error "PyInstaller executable not found at: $exePath"
          exit 1
        }

    - name: Build NSIS installer
      env:
        # Azure Trusted Signing credentials (only set if secrets exist)
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
        AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
        AZURE_TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.AZURE_SIGNING_PROFILE }}
      run: |
        Write-Host "Building NSIS installer with code signing..."
        
        $buildParams = @()
        
        # Add certificate source if Azure credentials are available and not skipping signing
        if ("${{ secrets.AZURE_CLIENT_ID }}" -and "${{ secrets.AZURE_CLIENT_SECRET }}" -and ("${{ github.event.inputs.skip_signing }}" -ne "true")) {
          Write-Host "Using Azure Trusted Signing for installer"
          $buildParams += "-CertificateSource", "Azure"
        } elseif ("${{ github.event.inputs.skip_signing }}" -eq "true") {
          Write-Host "Skipping installer code signing (requested)"
          $buildParams += "-SkipSigning"
        } else {
          Write-Host "No Azure credentials available for installer, will try auto-detection"
        }
        
        # Add verbose output for CI
        $buildParams += "-Verbose"
        
        # Run the installer build
        & ".\packaging\installer\build_installer.ps1" @buildParams
        
        # Verify installer was created
        $installerPath = "dist\PokePokeInstaller-${{ steps.version.outputs.version }}.exe"
        if (Test-Path $installerPath) {
          $fileInfo = Get-Item $installerPath
          Write-Host "✓ Installer created: $($fileInfo.Length) bytes"
        } else {
          # Try with default version if versioned installer not found
          $defaultInstallerPath = "dist\PokePokeInstaller-0.1.0.exe"
          if (Test-Path $defaultInstallerPath) {
            # Rename to versioned name
            Move-Item $defaultInstallerPath $installerPath
            $fileInfo = Get-Item $installerPath
            Write-Host "✓ Installer created and renamed: $($fileInfo.Length) bytes"
          } else {
            Write-Error "Installer not found at: $installerPath or $defaultInstallerPath"
            exit 1
          }
        }

    - name: Verify digital signatures
      run: |
        Write-Host "=== Verifying Digital Signatures ===" -ForegroundColor Cyan
        
        # Check executable signature
        $exePath = "dist\PokePoke\PokePoke.exe"
        if (Test-Path $exePath) {
          Write-Host "`nExecutable signature:" -ForegroundColor Yellow
          $exeSig = Get-AuthenticodeSignature -FilePath $exePath
          Write-Host "Status: $($exeSig.Status)"
          Write-Host "Signer: $($exeSig.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($exeSig.SignerCertificate.Thumbprint)"
          
          if ($exeSig.Status -eq "Valid") {
            Write-Host "✓ Executable signature is valid" -ForegroundColor Green
          } elseif ($exeSig.SignerCertificate) {
            Write-Host "⚠️ Executable is signed but status: $($exeSig.Status)" -ForegroundColor Yellow
          } else {
            Write-Host "❌ Executable is not signed" -ForegroundColor Red
          }
        }
        
        # Check installer signature
        $installerPath = "dist\PokePokeInstaller-${{ steps.version.outputs.version }}.exe"
        if (Test-Path $installerPath) {
          Write-Host "`nInstaller signature:" -ForegroundColor Yellow
          $installerSig = Get-AuthenticodeSignature -FilePath $installerPath
          Write-Host "Status: $($installerSig.Status)"
          Write-Host "Signer: $($installerSig.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($installerSig.SignerCertificate.Thumbprint)"
          
          if ($installerSig.Status -eq "Valid") {
            Write-Host "✓ Installer signature is valid" -ForegroundColor Green
          } elseif ($installerSig.SignerCertificate) {
            Write-Host "⚠️ Installer is signed but status: $($installerSig.Status)" -ForegroundColor Yellow
          } else {
            Write-Host "❌ Installer is not signed" -ForegroundColor Red
          }
        }

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pokepoke-windows-signed-v${{ steps.version.outputs.version }}
        path: |
          dist/PokePoke/
          dist/PokePokeInstaller-*.exe
        retention-days: 90

    - name: Upload installer only
      uses: actions/upload-artifact@v4
      with:
        name: pokepoke-installer-v${{ steps.version.outputs.version }}
        path: dist/PokePokeInstaller-*.exe
        retention-days: 90

    - name: Create GitHub Release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/PokePokeInstaller-*.exe
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        body: |
          ## PokePoke Release ${{ steps.version.outputs.version }}
          
          ### Windows Installer
          - **PokePokeInstaller-${{ steps.version.outputs.version }}.exe** - Complete Windows installer with WebView2
          
          ### Installation
          1. Download the installer above
          2. Run the installer (Windows may show SmartScreen warning for unsigned builds)
          3. Follow installation wizard
          4. PokePoke will be available in Start Menu
          
          ### Code Signing Status
          ${{ secrets.AZURE_CLIENT_ID && '✅ **Digitally Signed** - This release is code signed with Azure Trusted Signing' || '⚠️ **Unsigned Build** - This build is not code signed and will show security warnings' }}
          
          ### Requirements
          - Windows 10/11 (x64)
          - Microsoft Edge WebView2 (included in installer)
          - Python 3.12+ (bundled with installer)
          
          ### What's Changed
          See the commit history for detailed changes in this release.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Summary
      run: |
        Write-Host "`n=== Build Summary ===" -ForegroundColor Green
        Write-Host "Version: ${{ steps.version.outputs.version }}"
        if ("${{ secrets.AZURE_CLIENT_ID }}" -and ("${{ github.event.inputs.skip_signing }}" -ne "true")) {
          Write-Host "Signing: Azure Trusted Signing"
        } else {
          Write-Host "Signing: Disabled/Unavailable"
        }
        Write-Host "Artifacts:"
        
        Get-ChildItem "dist\" -Recurse -File | ForEach-Object {
          $size = [math]::Round($_.Length / 1MB, 2)
          Write-Host "  - $($_.Name): ${size} MB"
        }
        
        if ("${{ github.event_name }}" -eq "push") {
          Write-Host "`nGitHub Release: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        }
        
        Write-Host "`nNext steps:"
        Write-Host "1. Download and test the installer on a clean Windows machine"
        Write-Host "2. Verify no SmartScreen warnings (for signed builds)"
        Write-Host "3. Test the installed application functionality"