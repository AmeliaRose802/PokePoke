[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pokepoke"
version = "0.1.0"
description = "Autonomous Beads + Copilot CLI Orchestrator"
authors = [{name = "Amelia Payne"}]
requires-python = ">=3.12"

[project.scripts]
pokepoke = "pokepoke.__main__:main"
pokepoke-init = "pokepoke.init:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pokepoke = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "real_terminal_banner: opt out of the autouse _suppress_terminal_banner fixture",
    "allow_real_bd: opt out of _block_real_bd_subprocess fixture",
    "allow_git_repair: opt out of _block_real_git_repair fixture",
]

# Exclude patterns
norecursedirs = [
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg",
    "venv",
    ".venv",
    "__pycache__"
]
timeout = 10
timeout_method = "thread"
filterwarnings = [
    'ignore::pytest.PytestWarning',
    'ignore:coroutine .* was never awaited:RuntimeWarning',
]

# Coverage settings
[tool.coverage.run]
source = ["src/pokepoke"]
parallel = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod"
]


# Ruff linter configuration
[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg",
    "venv",
    ".venv",
    "__pycache__",
    "/worktrees",
]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "C90", "PLR", "T20", "I", "RUF", "N", "S", "PERF"]
ignore = [
    "E402",    # Module-level import not at top - intentional logger-before-imports pattern
    "E501",    # Line too long
    "SIM103",  # Return condition directly - sometimes less readable
    "SIM108",  # Ternary operator - sometimes less readable
    "PLR0911", # Too many return statements - requires refactoring
    "PLR0912", # Too many branches - requires refactoring
    # PLR0913 (too many arguments) is NOW ENFORCED for new code.
    # Existing violations are grandfathered via per-file-ignores below.
    # See PokePoke-h072s epic and sub-tasks for refactoring plan.
    "PLR0915", # Too many statements - requires refactoring
    "PLR2004", # Magic value used in comparison - too noisy for existing codebase
    "S603",    # subprocess without shell=True - expected for CLI orchestrator
    "S607",    # subprocess with partial path - expected for CLI orchestrator using git, bd, pwsh, tasklist
    "S101",    # assert - used for internal invariants, not security-sensitive
    "S110",    # try-except-pass - intentional in graceful-degradation patterns
    "S310",    # suspicious-url-open-usage - false positive for controlled URLs
    "S311",    # suspicious-non-cryptographic-random-usage - used for non-security purposes (A/B selection)
    "N806",    # Non-lowercase variable in function - used for threading.Event, Path constants, etc.
    "RUF001",  # Ambiguous unicode character in string - emoji are intentional UI elements
    "RUF002",  # Ambiguous unicode character in docstring - emoji in docs
    "RUF003",  # Ambiguous unicode character in comment - emoji in comments
    "RUF012",  # Mutable class default - false positive on ctypes._fields_ and dispatch dicts
    "RUF022",  # Unsorted __all__ - grouped by category with comments
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.per-file-ignores]
".githooks/**" = [
    "T20",     # Standalone scripts: print() is the correct output mechanism
]
"tests/**/*" = [
    "C901",    # Tests: allow complex functions
    "S101",    # Tests: allow assert statements (inherent to test framework)
    "S108",    # Tests: allow hardcoded temp paths for test fixtures
    "S607",    # Tests: allow partial executable paths in test scenarios
    "PERF401", # Tests: allow manual list comprehension
    "PLR0913", # Tests: mirror source function signatures — grandfathered
]
"src/pokepoke/models/sdk_await.py" = ["C901"]  # Complex timeout logic (extracted from sdk_helpers)
"src/pokepoke/agents/parallel_support.py" = ["C901", "PLR0913"]  # Complex dispatch logic; PLR0913 grandfathered
"src/pokepoke/agents/parallel_worker_pool.py" = ["C901", "PLR0913"]  # Complex future collection; PLR0913 grandfathered

# PLR0913 grandfathered violations — refactor tracked by PokePoke-h072s sub-tasks
# Remove entries as functions are refactored to use config dataclasses
"src/pokepoke/agents/agent_registry.py" = ["PLR0913"]
"src/pokepoke/agents/agent_runner.py" = ["PLR0913"]
"src/pokepoke/agents/cleanup_agents.py" = ["PLR0913"]
"src/pokepoke/agents/gate_agent_executor.py" = ["PLR0913"]
"src/pokepoke/agents/parallel.py" = ["PLR0913"]
"src/pokepoke/agents/parallel_cleanup.py" = ["PLR0913"]
"src/pokepoke/beads/beads_item_stats_store.py" = ["PLR0913"]
"src/pokepoke/beads/cli_retry.py" = ["PLR0913"]
"src/pokepoke/desktop/desktop_api_agents.py" = ["PLR0913"]
"src/pokepoke/desktop/desktop_ui.py" = ["PLR0913"]
"src/pokepoke/git/git_helpers.py" = ["PLR0913"]
"src/pokepoke/maintenance/maintenance_scheduler.py" = ["PLR0913"]
"src/pokepoke/models/ai_backends.py" = ["PLR0913"]
"src/pokepoke/models/copilot_sdk.py" = ["PLR0913"]
"src/pokepoke/models/model_history.py" = ["PLR0913"]
"src/pokepoke/models/model_sync_beads.py" = ["PLR0913"]
"src/pokepoke/models/sdk_event_handler.py" = ["PLR0913"]
"src/pokepoke/models/sdk_helpers.py" = ["PLR0913"]
"src/pokepoke/models/sdk_watchdog.py" = ["PLR0913"]
"src/pokepoke/orchestration/finalization.py" = ["PLR0913"]
"src/pokepoke/orchestration/session_lifecycle.py" = ["PLR0913"]
"src/pokepoke/orchestration/work_item_session.py" = ["PLR0913"]
"src/pokepoke/orchestration/worker_context.py" = ["PLR0913"]
"src/pokepoke/orchestration/workflow_helpers.py" = ["PLR0913"]
"src/pokepoke/protocols.py" = ["PLR0913"]
"src/pokepoke/stats/performance_monitor.py" = ["PLR0913"]
"src/pokepoke/stats/persistent_json_store.py" = ["PLR0913"]
"src/pokepoke/stats/session_journal.py" = ["PLR0913"]
"src/pokepoke/worktrees/worktree_cleanup.py" = ["PLR0913"]
"src/pokepoke/worktrees/worktree_finalization.py" = ["PLR0913"]
"src/pokepoke/worktrees/worktrees.py" = ["PLR0913"]

# Mypy type checking configuration
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
strict = true
show_error_codes = true
pretty = true

# Exclude test files from strict checking (they have different requirements)
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_any_unimported = false

# opentelemetry SDK may not be installed in all environments
[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

# copilot SDK may not be installed in all environments
[[tool.mypy.overrides]]
module = "copilot.*"
ignore_missing_imports = true

# copilot_sdk uses conditional imports that produce different type: ignore
# needs depending on whether the copilot SDK is installed
[[tool.mypy.overrides]]
module = "pokepoke.models.copilot_sdk"
warn_unused_ignores = false

# native_icon imports .NET types (System, System.Drawing) that are only
# available when pythonnet is loaded — the type: ignore[import-not-found]
# comments are unused in environments with pythonnet installed
[[tool.mypy.overrides]]
module = "pokepoke.desktop.native_icon"
warn_unused_ignores = false

# manifest_utils is installed without py.typed marker
[[tool.mypy.overrides]]
module = "pokepoke.utils.manifest_utils"
ignore_missing_imports = true
follow_imports = "skip"

# worktree_cleanup uses manifest_utils (untyped) — suppress Any-return warnings
[[tool.mypy.overrides]]
module = "pokepoke.worktrees.worktree_cleanup"
warn_return_any = false

# git_operations re-exports symbols from git_helpers for convenience
[[tool.mypy.overrides]]
module = "pokepoke.git.git_operations"
implicit_reexport = true

# pywebview_patches monkey-patches third-party types; suppress attr-defined
[[tool.mypy.overrides]]
module = "pokepoke.desktop.pywebview_patches"
disable_error_code = ["attr-defined"]
